<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OA Kalender 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEFEC;
    --surface:#FFFFFF;
    --ink-blue:#16324A;
    --ink-blue-2:#1F4463;
    --ink:#2B3540;
    --muted:#71818F;
    --border:#DEDEDA;
    --accent:#E5622A;
    --accent-tint:#FBE3D6;
    --blue-tint:#E3EBF1;
    --ok-green:#3F8F5F;
    --radius:14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{max-width:640px;margin:0 auto;padding-bottom:calc(32px + var(--safe-bottom));}

  /* ---------- Header ---------- */
  header.top{
    position:sticky;top:0;z-index:20;
    background:var(--ink-blue);
    padding-top:calc(18px + var(--safe-top));
    padding-bottom:16px;
    color:#fff;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
    box-shadow:0 6px 18px rgba(22,50,74,0.18);
  }
  .top-inner{padding:0 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .brand h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.3px;
    margin:0;
    line-height:1.05;
    text-transform:uppercase;
  }
  .brand .sub{
    margin-top:4px;
    font-size:13px;
    color:#B9CCDB;
    font-weight:500;
  }
  .refresh-btn{
    appearance:none;border:1px solid rgba(255,255,255,0.28);
    background:rgba(255,255,255,0.08);
    color:#fff;border-radius:999px;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    transition:transform .5s ease, background .2s ease;
  }
  .refresh-btn:active{background:rgba(255,255,255,0.2);}
  .refresh-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .status-row{
    padding:10px 18px 0;
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:#9FB4C6;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok-green);flex-shrink:0;}
  .status-dot.stale{background:#D9A441;}
  .status-dot.error{background:#D9583E;}

  /* ---------- Legend ---------- */
  .legend{
    display:flex;gap:14px;padding:14px 18px 4px;
    font-size:12px;color:var(--muted);flex-wrap:wrap;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:9px;height:9px;border-radius:3px;}
  .legend .dot.flat{background:var(--blue-tint);border:1.5px solid #7FA0BC;}
  .legend .dot.hill{background:var(--accent-tint);border:1.5px solid var(--accent);}

  /* ---------- Month groups ---------- */
  .month-heading{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-blue-2);
    margin:22px 18px 8px;
  }

  /* ---------- Cards ---------- */
  .list{padding:0 12px;display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--border);
    padding:0;
    display:flex;
    align-items:stretch;
    overflow:hidden;
    scroll-margin-top:104px;
  }
  .date-block{
    flex-shrink:0;
    width:54px;
    background:var(--ink-blue);
    border-radius:10px;
    color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px 2px;
    margin:12px 0 12px 12px;
  }
  .date-block .day{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:24px;line-height:1;
  }
  .date-block .dow{
    font-size:10px;letter-spacing:0.5px;text-transform:uppercase;
    color:#9FB4C6;margin-top:3px;
  }

  .groups{flex:1;min-width:0;display:flex;flex-direction:column;}
  .group-row{
    flex:1;min-width:0;
    display:flex;align-items:center;gap:10px;
    padding:12px;
  }
  .group-row + .group-row{border-top:1px solid var(--border);}
  .group-label{
    flex-shrink:0;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:700;
  }
  .group-label.a{background:var(--ink-blue);color:#fff;}
  .group-label.b{background:#5DCAA5;color:#04342C;}

  .card-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;}
  .row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ride-name{
    font-weight:700;font-size:15.5px;color:var(--ink-blue);
    text-transform:capitalize;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    min-width:0;flex-shrink:1;
  }
  .tag{
    font-size:10.5px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;flex-shrink:0;
  }
  .tag.flat{background:var(--blue-tint);color:var(--ink-blue-2);}
  .tag.hill{background:var(--accent-tint);color:var(--accent);}
  .tag.tbd{background:#EFEFEC;color:var(--muted);border:1px dashed #C7C7C1;}

  .meta-row{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .meta-row .item{display:flex;align-items:center;gap:4px;}
  .meta-row svg{flex-shrink:0;}

  .stat-line{display:flex;align-items:center;gap:8px;}
  .stat-line .figs{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--ink);}
  .stat-line .figs .sep{color:var(--muted);font-weight:400;margin:0 2px;}
  .stat-line .unit{font-size:11px;color:var(--muted);font-weight:400;font-family:'Inter',sans-serif;}
  .no-stats-note{font-size:12.5px;color:var(--muted);}

  .profile-icon{flex-shrink:0;}

  .gpx-panel{
    flex-shrink:0;width:44px;height:44px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .gpx-btn{
    appearance:none;border:none;cursor:pointer;margin:0;padding:0;
    width:100%;height:100%;border-radius:10px;
    background:var(--ink-blue);color:#fff;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .gpx-btn:active{background:var(--ink-blue-2);}
  .gpx-btn.loading{opacity:0.6;pointer-events:none;}

  .gpx-panel.empty{
    background:#E6E6E1;color:var(--muted);
    padding:0 4px;text-align:center;
  }
  .gpx-panel.empty .empty-label{
    font-size:8.5px;font-weight:600;line-height:1.15;
  }

  /* ---------- Empty / loading / error ---------- */
  .skeleton-card{height:74px;border-radius:var(--radius);background:linear-gradient(90deg,#fff 25%,#f2f2ef 37%,#fff 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border:1px solid var(--border);}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .empty-state, .error-state{
    margin:32px 18px;padding:24px;border-radius:var(--radius);
    background:var(--surface);border:1px solid var(--border);
    text-align:center;color:var(--muted);font-size:14px;
  }
  .error-state{color:#B23A22;background:#FCEEE9;border-color:#F2CCBB;}

  footer.foot{
    text-align:center;font-size:11.5px;color:var(--muted);padding:26px 18px 8px;
  }

  @media (prefers-reduced-motion: reduce){
    .refresh-btn.spinning svg{animation:none;}
    .skeleton-card{animation:none;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>OA Kalender</h1>
        <div class="sub">Ritten 2026</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" aria-label="Vernieuwen" title="Vernieuwen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
    <div class="status-row" id="statusRow">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Laden…</span>
    </div>
  </header>

  <div class="legend">
    <span><i class="dot flat"></i>Vlak (&lt;500 Hm)</span>
    <span><i class="dot hill"></i>Heuvel (&gt;500 Hm)</span>
  </div>

  <div id="content">
    <div class="list" style="padding-top:8px;">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <footer class="foot">OA Wielerclub · gegevens uit de clubkalender</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- Config ----------
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1G5Id019qKcPmQGS8o8NODp8FuHGf7A2ASue6BLC-sA23UjIq6Ps3Fuh4NlYZGI8wZW9HCSB8is9F/pub?gid=699677712&single=true&output=csv";
  var GPX_API_URL = "https://api.github.com/repos/oacyclingteam/oact/contents/gpx/2027";
  var GPX_RAW_BASE = "https://raw.githubusercontent.com/oacyclingteam/oact/main/gpx/2027/";
  var HEUVEL_THRESHOLD_HM = 500;
  var CACHE_KEY = "oact-calendar-cache-v1";

  var MONTHS_NL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  var MONTHS_NL_SHORT = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  var MONTHS_MAP = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  var contentEl = document.getElementById('content');
  var statusText = document.getElementById('statusText');
  var statusDot = document.getElementById('statusDot');
  var refreshBtn = document.getElementById('refreshBtn');

  // ---------- Helpers ----------
  function normalize(s){
    return (s||"")
      .toString()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");
  }

  function parseCSV(text){
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i=0;i<text.length;i++){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field+='"'; i++; } else { inQuotes=false; }
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ row.push(field); field=""; }
        else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
        else if (c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(v){ return v && v.trim(); }); });
  }

  function parseDate(datum){
    // format: 01-Mar-2026
    var m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec((datum||"").trim());
    if (!m) return null;
    var day = parseInt(m[1],10);
    var mon = MONTHS_MAP[m[2].toLowerCase()];
    var year = parseInt(m[3],10);
    if (mon === undefined) return null;
    return new Date(year, mon, day);
  }

  function formatTime(t){
    if (!t) return null;
    return t.replace(/h/i,":");
  }

  function extractKmHm(filename){
    var km = /(\d+)\s*km/i.exec(filename);
    var hm = /(\d+)\s*hm/i.exec(filename);
    return {
      km: km ? parseInt(km[1],10) : null,
      hm: hm ? parseInt(hm[1],10) : null
    };
  }

  function findGpxMatch(ritName, gpxFiles){
    var target = normalize(ritName);
    if (!target) return null;
    for (var i=0;i<gpxFiles.length;i++){
      var f = gpxFiles[i];
      var normFile = normalize(f.name);
      if (normFile.indexOf(target) !== -1){
        return f;
      }
    }
    return null;
  }

  function timeAgo(ts){
    var diff = Math.round((Date.now()-ts)/1000);
    if (diff < 45) return "net bijgewerkt";
    if (diff < 3600) return Math.round(diff/60) + " min geleden bijgewerkt";
    if (diff < 86400) return Math.round(diff/3600) + " u geleden bijgewerkt";
    return Math.round(diff/86400) + " d geleden bijgewerkt";
  }

  // ---------- Rendering ----------
  function profileSVG(kind){
    if (kind === "hill"){
      return '<svg class="profile-icon" width="34" height="14" viewBox="0 0 34 14" fill="none"><polyline points="1,12 7,4 12,10 18,2 24,9 29,5 33,11" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
    }
    return '<svg class="profile-icon" width="34" height="14" viewBox="0 0 34 14" fill="none"><polyline points="1,9 8,8 14,9 20,7 27,8 33,7" stroke="#7FA0BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
  }

  function clockSVG(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';
  }

  function downloadSVG(){
    return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
  }

  function escapeAttr(s){
    return (s||"").toString()
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Forces a real download instead of the browser navigating to and
  // rendering the raw GPX/XML inline. Cross-origin `download` attributes
  // are ignored by most browsers, so we fetch the file ourselves and
  // trigger the save from a same-origin blob URL instead.
  function downloadGpx(url, filename, btn){
    btn.classList.add('loading');
    fetch(url)
      .then(function(r){
        if (!r.ok) throw new Error('download failed');
        return r.blob();
      })
      .then(function(blob){
        var blobUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 4000);
      })
      .catch(function(){
        // fallback: open in a new tab so the user can still save it manually
        window.open(url, '_blank', 'noopener');
      })
      .finally(function(){
        btn.classList.remove('loading');
      });
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.gpx-btn') : null;
    if (!btn) return;
    e.preventDefault();
    downloadGpx(btn.getAttribute('data-gpx-url'), btn.getAttribute('data-gpx-name'), btn);
  });

  // Renders a single group's row (name, tag, vertrek, stats, gpx button).
  // showLabel is false when a ride has only one group, to keep the 2026-style
  // single-row card unchanged when there's no B group in the data.
  function renderGroupRow(ritName, vertrek, match, showLabel, groupKey){
    var kmHm = match ? extractKmHm(match.name) : {km:null,hm:null};
    var hasStats = kmHm.km !== null && kmHm.hm !== null;
    var isHill = hasStats && kmHm.hm > HEUVEL_THRESHOLD_HM;

    var tagHtml;
    if (hasStats){
      tagHtml = '<span class="tag ' + (isHill?'hill':'flat') + '">' + (isHill?'Heuvel':'Vlak') + '</span>';
    } else {
      tagHtml = '<span class="tag tbd">GPX volgt</span>';
    }

    var metaHtml = '';
    if (vertrek){
      metaHtml += '<span class="item">' + clockSVG() + formatTime(vertrek) + '</span>';
    }

    var gpxPanelHtml;
    if (match){
      gpxPanelHtml = '<button type="button" class="gpx-panel gpx-btn" aria-label="Download GPX' + (showLabel?(' groep '+groupKey.toUpperCase()):'') + '" data-gpx-url="' + escapeAttr(match.download_url) + '" data-gpx-name="' + escapeAttr(match.name) + '">' +
        downloadSVG() + '</button>';
    } else {
      gpxPanelHtml = '<div class="gpx-panel empty"><span class="empty-label">binnenkort</span></div>';
    }

    var statLineHtml;
    if (hasStats){
      statLineHtml =
        '<div class="stat-line">' +
          '<span class="figs">' + kmHm.km + '<span class="unit"> km</span><span class="sep">·</span>' + kmHm.hm + '<span class="unit"> hm</span></span>' +
          profileSVG(isHill?'hill':'flat') +
        '</div>';
    } else {
      statLineHtml = '<div class="no-stats-note">Afstand en hoogtemeters volgen</div>';
    }

    var labelHtml = showLabel ? '<span class="group-label ' + groupKey + '">' + groupKey.toUpperCase() + '</span>' : '';

    return '<div class="group-row">' +
      labelHtml +
      '<div class="card-body">' +
        '<div class="row-top"><span class="ride-name">' + (ritName||'').toLowerCase() + '</span>' + tagHtml + '</div>' +
        '<div class="meta-row">' + metaHtml + '</div>' +
        statLineHtml +
      '</div>' +
      gpxPanelHtml +
    '</div>';
  }

  function renderCard(ride){
    var d = ride.date;
    var dayNum = d ? d.getDate() : "?";
    var dow = d ? MONTHS_NL_SHORT[d.getMonth()].toUpperCase() : "";
    // Only split into A/B rows when the sheet actually has a distinct Rit (B)
    // for this date — keeps older seasons without a B column unchanged.
    var hasB = !!ride.ritB && ride.ritB.toLowerCase() !== ride.rit.toLowerCase();

    var rowsHtml = renderGroupRow(ride.rit, ride.vertrek, ride.gpxMatchA, hasB, 'a');
    if (hasB){
      rowsHtml += renderGroupRow(ride.ritB, ride.vertrek, ride.gpxMatchB, true, 'b');
    }

    var tsAttr = d ? ' data-ts="' + d.getTime() + '"' : '';

    return '<div class="card"' + tsAttr + '>' +
      '<div class="date-block"><div class="day">' + dayNum + '</div><div class="dow">' + dow + '</div></div>' +
      '<div class="groups">' + rowsHtml + '</div>' +
    '</div>';
  }

  function render(rides, gpxFiles){
    if (!rides.length){
      contentEl.innerHTML = '<div class="empty-state">Geen ritten gevonden in de kalender.</div>';
      return;
    }

    var withGpx = rides.map(function(r){
      return Object.assign({}, r, {
        gpxMatchA: findGpxMatch(r.rit, gpxFiles),
        gpxMatchB: r.ritB ? findGpxMatch(r.ritB, gpxFiles) : null
      });
    });

    withGpx.sort(function(a,b){
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date - b.date;
    });

    var html = '';
    var currentMonthKey = null;
    withGpx.forEach(function(ride){
      var monthKey = ride.date ? (ride.date.getFullYear()+'-'+ride.date.getMonth()) : 'onbekend';
      if (monthKey !== currentMonthKey){
        if (currentMonthKey !== null) html += '</div>';
        var label = ride.date ? (MONTHS_NL[ride.date.getMonth()] + ' ' + ride.date.getFullYear()) : 'Datum onbekend';
        html += '<div class="month-heading">' + label + '</div><div class="list">';
        currentMonthKey = monthKey;
      }
      html += renderCard(ride);
    });
    html += '</div>';
    contentEl.innerHTML = html;
    scrollToNextRide();
  }

  var hasAutoScrolled = false;

  function scrollToNextRide(){
    if (hasAutoScrolled) return;
    hasAutoScrolled = true;

    var todayStart = new Date();
    todayStart.setHours(0,0,0,0);
    var todayTs = todayStart.getTime();

    var cards = contentEl.querySelectorAll('.card[data-ts]');
    var target = null;
    for (var i=0;i<cards.length;i++){
      var ts = parseInt(cards[i].getAttribute('data-ts'),10);
      if (ts >= todayTs){ target = cards[i]; break; }
    }
    if (!target) return; // season finished or no dated rides — stay at top

    requestAnimationFrame(function(){
      target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  function setStatus(state, ts){
    statusDot.className = 'status-dot' + (state === 'error' ? ' error' : state === 'stale' ? ' stale' : '');
    if (state === 'loading') statusText.textContent = 'Laden…';
    else if (state === 'error') statusText.textContent = 'Vernieuwen mislukt · toont laatste gegevens';
    else statusText.textContent = timeAgo(ts);
  }

  // ---------- Data parsing ----------
  function parseRides(csvText){
    var rows = parseCSV(csvText);
    if (!rows.length) return [];
    rows.shift(); // header
    return rows.map(function(r){
      return {
        date: parseDate(r[0]),
        vertrek: (r[1]||"").trim(),
        rit: (r[2]||"").trim(),
        ritB: (r[3]||"").trim()
      };
    }).filter(function(r){ return r.rit; });
  }

  // ---------- Fetch cycle ----------
  function loadFromCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      data.rides.forEach(function(r){ r.date = r.date ? new Date(r.date) : null; });
      return data;
    } catch(e){ return null; }
  }

  function saveToCache(rides, gpxFiles, ts){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({ rides: rides, gpxFiles: gpxFiles, ts: ts }));
    } catch(e){ /* storage unavailable, ignore */ }
  }

  function fetchLive(){
    refreshBtn.classList.add('spinning');
    setStatus('loading');

    var csvPromise = fetch(SHEET_CSV_URL, {cache:"no-store"}).then(function(r){
      if (!r.ok) throw new Error('CSV fetch failed');
      return r.text();
    });
    var gpxPromise = fetch(GPX_API_URL).then(function(r){
      if (!r.ok) throw new Error('GPX list fetch failed');
      return r.json();
    }).then(function(list){
      return list.filter(function(f){ return /\.gpx$/i.test(f.name); });
    }).catch(function(){
      return []; // if folder missing/empty, just show no GPX matches
    });

    Promise.all([csvPromise, gpxPromise]).then(function(results){
      var rides = parseRides(results[0]);
      var gpxFiles = results[1];
      var ts = Date.now();
      render(rides, gpxFiles);
      setStatus('ok', ts);
      saveToCache(rides, gpxFiles, ts);
    }).catch(function(){
      var cached = loadFromCache();
      if (cached){
        render(cached.rides, cached.gpxFiles);
        setStatus('error');
      } else {
        contentEl.innerHTML = '<div class="error-state">Kon de kalender niet laden. Controleer je internetverbinding en probeer opnieuw.</div>';
        setStatus('error');
      }
    }).finally(function(){
      refreshBtn.classList.remove('spinning');
    });
  }

  refreshBtn.addEventListener('click', fetchLive);

  // ---------- Init ----------
  var cached = loadFromCache();
  if (cached){
    render(cached.rides, cached.gpxFiles);
    setStatus('ok', cached.ts);
  }
  fetchLive(); // always check for fresh data in background (or foreground if no cache)

})();
</script>
</body>
</html>
